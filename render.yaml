services:
  - type: web
    name: cbt-exam-system
    env: node
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    disk:
      name: cbt-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/cbt_database.sqlite
      - key: JWT_SECRET
        generateValue: true
